<!DOCTYPE html>
<!-- data-theme 先寫在這裡，讓預設的亮色在樣式表套用的當下就生效。
     樣式表的 :root 是暗色、亮色是覆寫上去的，少了這一行，每次開啟會先
     出現一格畫面的暗色再跳成亮色（JS 要等全部檔案載完才套主題）。
     使用者存過的設定仍然以資料為準，app.js 的 applyTheme() 會覆寫這裡。 -->
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 網頁安全政策 CSP（261106a）：規定這一頁只能跑哪些程式、只能連去哪裡。
     就算哪天又有一處把使用者的字當成 HTML 插進去，藏在裡面的 onerror 之類
     也不會執行，資料也送不到 Google 以外的地方。
       script-src  只跑自己儲存庫的 js 與 Google 登入元件；wasm-unsafe-eval 給 QR 辨識的 WebAssembly
       connect-src 只能連 Google 的 Drive／帳號 API
       style-src   unsafe-inline 是因為程式大量用 style 屬性與自訂配色的 <style>（只放驗過的色碼）
       img-src     data:／blob: 給貼上的 QR 截圖
       file:       讓檔案總管雙擊 index.html 的本機測試照樣能跑；放在 https 網頁上不會有任何作用
     要加新的對外連線或第三方檔案時，這裡一定要跟著改，而且要先想清楚。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' file: 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' file: data: blob:; font-src 'self' file:; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>便籤／常用語工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- 頂部列 -->
  <header id="topbar">
    <div class="brand" id="appTitle" title="點擊可改名">便籤／常用語</div>
    <input type="search" id="searchBox" placeholder="搜尋標籤或內容…" autocomplete="off">
    <div class="spacer"></div>
    <!-- 雲端同步：常駐一顆狀態點，點開才是帳號與動作。
         同步跟容量不一樣——它會出錯，而且出錯要馬上看得到，收進選單等於沒人看見 -->
    <button class="zoom-one sync-one" id="btnSync" title="雲端同步">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.2 9.2 3.9 3.9 0 0 0 6.5 19z"/>
      </svg>
      <span class="sync-dot" id="syncDot"></span>
    </button>

    <!-- 顯示大小：平常只有一顆膠囊，點開才列出級距 -->
    <button class="zoom-one" id="btnZoom" title="整個畫面的顯示大小">
      <span>顯示大小</span><b id="zoomVal">100%</b>
    </button>
    <button class="icon-btn" id="btnMenu" title="選單">☰</button>
  </header>

  <div id="body">

    <!-- 左側分類側欄 -->
    <nav id="sidebar">
      <div id="categoryList"></div>
      <button class="cat-add" id="btnAddCategory" title="新增分類">＋</button>
    </nav>

    <!-- 卡片區 -->
    <main id="content">
      <div id="contentHeader">
        <h1 id="currentCategoryName">—</h1>
        <button class="btn-primary" id="btnAddTab">＋ 新增卡片</button>
      </div>
      <div id="cardGrid"></div>
      <div id="emptyHint" class="empty-hint" hidden>
        這個分類還沒有卡片。點右上角「＋ 新增卡片」開始。
      </div>
    </main>

  </div>
</div>

<!-- 複製成功的浮動提示 -->
<div id="toast" hidden></div>

<!-- 通用彈窗 -->
<div id="modalBackdrop" hidden>
  <div id="modal">
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalFooter"></div>
  </div>
</div>

<!-- 顯示大小的級距選單 -->
<div id="zoomPanel" hidden></div>

<!-- 同步面板。跟 zoomPanel 一樣放在 body 底下而不是 #topbar 裡面：
     topbar 有 backdrop-filter，會替裡面的固定定位元素另外開一層，
     面板畫出來會霧掉、位置也變成相對於 topbar（截圖才看得出來） -->
<div id="syncPanel" hidden></div>

<!-- ☰ 選單 -->
<div id="menuPanel" hidden>
  <button data-act="export">匯出資料</button>
  <button data-act="shareExport">匯出卡片給別人</button>
  <button data-act="import">匯入資料</button>
  <hr>
  <button data-act="trash">最近刪除</button>
  <hr>
  <button data-act="appearance">外觀</button>
  <button data-act="rename">修改標題</button>
  <button data-act="about">關於／說明</button>
  <hr>
  <!-- 瀏覽器儲存空間。收在選單裡：平常不佔畫面，但真的滿了要做的事就在旁邊 -->
  <div id="menuQuota">
    <div id="menuQuotaText"></div>
    <div class="qbar"><div class="qbar-fill" id="menuQuotaFill"></div></div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="js/data.js"></script>
<script src="js/vault.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/tabs.js"></script>
<script src="js/theme.js"></script>
<script src="js/pip.js"></script>
<script src="js/drive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
